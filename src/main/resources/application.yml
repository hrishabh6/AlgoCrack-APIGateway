server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: AlgoCrack-APIGateway

  cloud:
    gateway:
      server:
        webflux:
          # Strip duplicate CORS headers added by downstream services
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_UNIQUE
          # Route definitions
          routes:
            # ─── Auth Service (NO JWT required) ───
            - id: auth-service
              uri: ${AUTH_SERVICE_BASE_URL:http://auth-service:7483}
              predicates:
                - Path=/api/v1/auth/**

            # ─── Problem Service (Questions) ───
            - id: problem-service-questions-public
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/questions/**
                - Method=GET

            - id: problem-service-questions-protected
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/questions/**
              filters:
                - name: JwtAuthentication

            # ─── Problem Service (Tags) ───
            - id: problem-service-tags-public
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/tags/**
                - Method=GET

            - id: problem-service-tags-protected
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/tags/**
              filters:
                - name: JwtAuthentication

            # ─── Problem Service (TestCases) ───
            - id: problem-service-testcases-public
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/testcases/**
                - Method=GET

            - id: problem-service-testcases-protected
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/testcases/**
              filters:
                - name: JwtAuthentication

            # ─── Problem Service (Solutions) ───
            - id: problem-service-solutions-public
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/solutions/**
                - Method=GET

            - id: problem-service-solutions-protected
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/solutions/**
              filters:
                - name: JwtAuthentication

            # ─── Problem Service (User problem lists — always JWT, user-owned data) ───
            - id: problem-service-problem-lists
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/problem-lists/**
              filters:
                - name: JwtAuthentication

            # ─── Problem Service (User Profile) ───
            - id: problem-service-user-profile
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/user/**
              filters:
                - name: JwtAuthentication

            # ─── Problem Service (Daily Challenge — public read) ───
            - id: problem-service-daily-challenges-public
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/daily-challenges/**
                - Method=GET

            # ─── Problem Service (Daily Challenge — admin) ───
            - id: problem-service-daily-challenges-admin
              uri: ${PROBLEM_SERVICE_URL:http://problem-service:8084}
              predicates:
                - Path=/api/v1/admin/daily-challenges/**,/api/v1/admin/potd-problems/**
              filters:
                - name: JwtAuthentication

            # ─── Submission Service (JWT required) ───
            - id: submission-service
              uri: ${SUBMISSION_SERVICE_URL:http://submission-service:8080}
              predicates:
                - Path=/api/v1/submissions/**
              filters:
                - name: JwtAuthentication

            # ─── Submission Service — progress, badges, leaderboard ───
            - id: submission-service-progress
              uri: ${SUBMISSION_SERVICE_URL:http://submission-service:8080}
              predicates:
                - Path=/api/v1/progress/**,/api/v1/badges,/api/v1/leaderboard
              filters:
                - name: JwtAuthentication

            # ─── Submission Service — admin progress ───
            - id: submission-service-progress-admin
              uri: ${SUBMISSION_SERVICE_URL:http://submission-service:8080}
              predicates:
                - Path=/api/v1/admin/progress/**
              filters:
                - name: JwtAuthentication

            # ─── Submission Service — playground workspaces ───
            - id: submission-service-playground
              uri: ${SUBMISSION_SERVICE_URL:http://submission-service:8080}
              predicates:
                - Path=/api/v1/playgrounds/**
              filters:
                - name: JwtAuthentication

# JWT Configuration (RS256 — public key only)
jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.hrishabh.algocrackapigateway: INFO
    org.springframework.cloud.gateway: INFO
