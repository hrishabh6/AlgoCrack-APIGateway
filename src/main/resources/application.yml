server:
  port: 9090

spring:
  application:
    name: AlgoCrack-APIGateway

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Route definitions
      routes:
        # ─── Auth Service (NO JWT required) ───
        - id: auth-service
          uri: http://localhost:7483
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # ─── Problem Service (JWT required) ───
        - id: problem-service-questions
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/questions/**
          filters:
            - name: JwtAuthentication

        - id: problem-service-tags
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/tags/**
          filters:
            - name: JwtAuthentication

        - id: problem-service-testcases
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/testcases/**
          filters:
            - name: JwtAuthentication

        - id: problem-service-solutions
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/solutions/**
          filters:
            - name: JwtAuthentication

        # ─── Submission Service (JWT required) ───
        - id: submission-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/submissions/**
          filters:
            - name: JwtAuthentication

# JWT Configuration (RS256 — public key only)
jwt:
  public-key-path: classpath:keys/public.pem

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.hrishabh.algocrackapigateway: DEBUG
    org.springframework.cloud.gateway: INFO
